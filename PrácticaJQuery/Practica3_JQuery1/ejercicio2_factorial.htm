<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Factorial con jQuery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <h2>Calcular factorial</h2>

    <form id="formFactorial">
        <label for="numero">Ingrese un número:</label><br>
        <input type="number" id="numero"><br><br>
        <button type="submit">Calcular</button>
    </form>

    <p id="resultado"></p>

    <script>
        $('#formFactorial').on('submit', function(event) {
            event.preventDefault();
            const n = parseInt($('#numero').val());
            let resultado;

            if (isNaN(n)) {
                resultado = "⚠️ Ingrese un número válido.";
            } else if (n < 0) {
                resultado = "⚠️ El factorial no está definido para números negativos.";
            } else {
                let factorial = 1;
                for (let i = 1; i <= n; i++) {
                    factorial *= i;
                }
                resultado = "El factorial de " + n + " es: " + factorial;
            }

            $('#resultado').text(resultado);
        });
    </script>

</body>
</html>
