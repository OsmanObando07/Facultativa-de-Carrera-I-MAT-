<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario y Tabla dinámica</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>

    <h2>Formulario de Registro</h2>

    <form id="formulario">
        <label>Nombre:</label><br>
        <input type="text" id="nombre"><br><br>

        <label>Correo:</label><br>
        <input type="email" id="correo"><br><br>

        <label>Intereses:</label><br>
        <input type="checkbox" name="intereses" value="Deportes"> Deportes<br>
        <input type="checkbox" name="intereses" value="Música"> Música<br>
        <input type="checkbox" name="intereses" value="Tecnología"> Tecnología<br><br>

        <label>Preferencia:</label><br>
        <input type="radio" name="preferencia" value="Mañana"> Mañana<br>
        <input type="radio" name="preferencia" value="Tarde"> Tarde<br>
        <input type="radio" name="preferencia" value="Noche"> Noche<br><br>

        <label>Fecha y hora:</label><br>
        <input type="datetime-local" id="fecha"><br><br>

        <label>Color favorito:</label><br>
        <input type="color" id="color"><br><br>

        <label>Valor (1 a 100):</label><br>
        <input type="range" id="valor" min="1" max="100"><br><br>

        <button type="button" id="enviar">Enviar</button>
    </form>

    <p id="mensajeError" style="color: red;"></p>

    <h2>Tabla de datos</h2>
    <div class="tabla-container">
        <table id="tabla">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Intereses</th>
                    <th>Preferencia</th>
                    <th>Fecha</th>
                    <th>Color</th>
                    <th>Valor</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</body>
</html>
