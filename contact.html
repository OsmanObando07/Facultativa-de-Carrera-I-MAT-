<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contacto — BookShelf</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header><h1>Contacto</h1><nav><a href="index.html">Inicio</a></nav></header>
<main>
  <form id="contactForm">
    <label>Nombre <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Mensaje <textarea name="message" required></textarea></label>
    <button type="submit">Enviar</button>
  </form>
  <div id="contactMsg" aria-live="polite"></div>
</main>

<script>
document.getElementById('contactForm').addEventListener('submit', e=>{
  e.preventDefault();
  // simulamos envío
  document.getElementById('contactMsg').textContent = 'Mensaje enviado. ¡Gracias! ✉️';
  e.target.reset();
});
</script>
</body>
</html>
